spring.application.name=fieldops-api

# PostgreSQL (valores padrão de desenvolvimento; sobrescreva por variáveis de ambiente)
spring.datasource.url=${FIELDOPS_DB_URL:jdbc:postgresql://localhost:5432/fieldops_db}
spring.datasource.username=${FIELDOPS_DB_USER:postgres}
spring.datasource.password=${FIELDOPS_DB_PASSWORD:admin}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Script SQL idempotente executado após o Hibernate (src/main/resources/schema.sql)
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

# Segurança (JWT)
# Em produção defina FIELDOPS_JWT_SECRET com um valor longo e aleatório.
fieldops.jwt.secret=${FIELDOPS_JWT_SECRET:fieldops-dev-secret-change-me-before-production-0123456789}
fieldops.jwt.expiration-hours=${FIELDOPS_JWT_EXPIRATION_HOURS:8}

# Configuração de armazenamento das evidências
file.upload-dir=${FIELDOPS_UPLOAD_DIR:uploads}

# Upload de imagens (RN-046: até 10 MB por arquivo)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# Dados de demonstração (usuários, cliente, local, equipamento, modelo e inspeção).
# Ative com FIELDOPS_SEED_DEMO=true na primeira execução.
fieldops.seed.demo=${FIELDOPS_SEED_DEMO:false}

# API
server.port=8080
